[project]
name = "coordinator"
version = "0.1.0"
description = "TUI/CLI coordinator that tracks planning and checkpoint status across many repos"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coordinator = "coordinator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "smoke", "unit", "integration", "system", "perf", "stress", "torture",
]
